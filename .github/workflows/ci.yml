name: CI

# The bundler had no automated gate at all, which is a poor fit for what it
# does: it rewrites how every portable binary in the workspace is linked, and
# the ways it breaks are invisible to `nix build`. A bundle that still builds
# can ship a binary that cannot exec, leak a nixpkgs wrapper full of
# /nix/store paths, or quietly go back through ld.so. tests/smoke.sh asserts
# the output contract instead, on two deliberately tiny subjects.
#
# The cross-distro run is the point of doing this in CI rather than locally:
# the whole promise is "runs on a distro that is not the build host", and the
# interpreter path is exactly where that promise has failed before.
#
# smoke.sh is the ONLY thing this workflow runs, which is why every contract
# has to be reachable from it. `nix flake check` is never invoked here, so a
# subject wired only into `checks` is built by nobody — that is what happened
# to the whole Windows/PE hostLibs contract, and smoke.sh now builds it (on the
# x86_64 runner; the arm runner reports the skip).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    name: bundle contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and aarch64 carry DIFFERENT psABI loader paths
        # (/lib64/ld-linux-x86-64.so.2 vs /lib/ld-linux-aarch64.so.1), and the
        # obvious "just use /lib64" for both silently breaks arm. Running both
        # is the only way that stays caught.
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4

      # Logos nix cache: reads cache.nix.logos.co (public + ci) and publishes
      # what this job builds; logos-co.cachix.org stays as a read-only fallback.
      - name: Set up Nix and the Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      - name: Bundle contract + cross-distro run
        run: |
          nix shell nixpkgs#patchelf nixpkgs#binutils \
            -c bash tests/smoke.sh .

  # smoke.sh is Linux-only; this is the one macOS contract: a sealed .app is carried byte for byte.
  sealed-bundle:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    name: sealed bundle (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nix and the Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      - name: A sealed bundle survives bundling
        run: nix build -L .#checks.aarch64-darwin.sealed-bundle --no-link
